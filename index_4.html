<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistisk GPX-Poster Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #111111;
            --border-color: #ffffff;
            --text-color: #ffffff;
            --subtext-color: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn {
            padding: 10px 18px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover { background: #333; border-color: #666; }
        .btn-primary { background: #ffffff; color: #000; border-color: #ffffff; font-weight: 600; }
        .btn-primary:hover { background: #e6e6e6; }

        input[type="file"] { display: none; }

        #poster-frame {
            width: 1040px;
            height: 1040px;
            background: var(--card-bg);
            border: 20px solid var(--border-color);
            padding: 40px 40px 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .poster-header {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            width: 100%;
            margin-bottom: 16px;
        }

        .poster-header h2 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            letter-spacing: 5px;
        }

        .poster-header span {
            font-size: 1.1rem;
            color: var(--subtext-color);
            letter-spacing: 3px;
        }

        #map-wrapper {
            width: 100%;
            flex: 1;
            border: 1px solid #222;
            position: relative;
            background: #09090b;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #09090b;
        }

        .poster-footer {
            width: 100%;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .coordinates {
            font-family: monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #aaa;
            text-align: center;
        }

        #elevation-profile {
            width: 70%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #elevation-profile svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 1.4rem;
            pointer-events: none;
            z-index: 500;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="gpx-input" class="btn btn-primary">📁 Velg GPX-fil</label>
        <input type="file" id="gpx-input" accept=".gpx">
        <button id="download-btn" class="btn" style="display: none;">📥 Last ned bilde</button>
    </div>

    <div id="poster-frame">
        <div class="poster-header">
            <h2 id="location-name">DIN TUR</h2>
            <span id="location-sub">LAST OPP GPX FOR Å GENERERE</span>
        </div>

        <div id="map-wrapper">
            <div id="placeholder-text">Ingen fil valgt</div>
            <div id="map"></div>
        </div>

        <div class="poster-footer">
            <div class="coordinates" id="coordinates">00.0000° N / 00.0000° E</div>
            <div id="elevation-profile"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_KEY = 'cb1_2o3a_1_671194bbedbad28841272141';

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            renderer: L.canvas()
        }).setView([69.65, 18.95], 10);

        // CartoDB Dark Matter med 'key=' parameter
        // (Bytt ut 'dark_all' med 'voyager' dersom du ønsker lyst kart)
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=${API_KEY}`, {
            subdomains: 'abcd',
            maxZoom: 19,
            crossOrigin: 'anonymous'
        }).addTo(map);

        let currentPolyline = null;

        document.getElementById('gpx-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const gpxText = event.target.result;
                behandleGpx(gpxText);
                document.getElementById('gpx-input').value = '';
            };
            
            reader.readAsText(file);
        });

        // Haversine-formel for å beregne reell avstand (km) mellom to GPS-punkter
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Jordens radius i km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function behandleGpx(gpxText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(gpxText, "text/xml");

            const trkpts = xmlDoc.querySelectorAll("trkpt");
            let rawPoints = [];

            trkpts.forEach(pt => {
                const lat = parseFloat(pt.getAttribute("lat"));
                const lon = parseFloat(pt.getAttribute("lon"));
                const eleEl = pt.querySelector("ele");
                const ele = eleEl ? parseFloat(eleEl.textContent) : null;

                if (!isNaN(lat) && !isNaN(lon)) {
                    rawPoints.push({ lat, lon, ele });
                }
            });

            if (rawPoints.length === 0) {
                const rtepts = xmlDoc.querySelectorAll("rtept");
                rtepts.forEach(pt => {
                    const lat = parseFloat(pt.getAttribute("lat"));
                    const lon = parseFloat(pt.getAttribute("lon"));
                    const eleEl = pt.querySelector("ele");
                    const ele = eleEl ? parseFloat(eleEl.textContent) : null;

                    if (!isNaN(lat) && !isNaN(lon)) {
                        rawPoints.push({ lat, lon, ele });
                    }
                });
            }

            if (rawPoints.length === 0) {
                alert("Fant ingen gyldige posisjons-punkter i GPX-filen.");
                return;
            }

            // Beregn akkumulert distanse (km) for hvert punkt
            let cumulativeDistance = 0;
            let points = [];
            let latLngs = [];

            for (let i = 0; i < rawPoints.length; i++) {
                if (i > 0) {
                    const dist = calculateDistance(
                        rawPoints[i-1].lat, rawPoints[i-1].lon,
                        rawPoints[i].lat, rawPoints[i].lon
                    );
                    cumulativeDistance += dist;
                }
                points.push({
                    lat: rawPoints[i].lat,
                    lon: rawPoints[i].lon,
                    ele: rawPoints[i].ele,
                    dist: cumulativeDistance
                });
                latLngs.push([rawPoints[i].lat, rawPoints[i].lon]);
            }

            if (currentPolyline) {
                map.removeLayer(currentPolyline);
            }

            document.getElementById('placeholder-text').style.display = 'none';

            currentPolyline = L.polyline(latLngs, {
                color: '#ffffff',
                opacity: 0.95,
                weight: 2.2,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            const bounds = currentPolyline.getBounds();
            map.fitBounds(bounds, { padding: [70, 70] });

            const center = bounds.getCenter();
            oppdaterKoordinater(center.lat, center.lng);
            hentStedsnavn(center.lat, center.lng);

            genererHoydeprofil(points);

            document.getElementById('download-btn').style.display = 'inline-block';
        }

        function oppdaterKoordinater(lat, lng) {
            const latStr = Math.abs(lat).toFixed(4) + '° ' + (lat >= 0 ? 'N' : 'S');
            const lngStr = Math.abs(lng).toFixed(4) + '° ' + (lng >= 0 ? 'E' : 'W');
            document.getElementById('coordinates').innerText = `${latStr} / ${lngStr}`;
        }

        async function hentStedsnavn(lat, lng) {
            document.getElementById('location-name').innerText = "HENTER STED...";
            document.getElementById('location-sub').innerText = "";

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=12`);
                const data = await res.json();
                
                const addr = data.address || {};
                const hovedNavn = addr.mountain || addr.natural || addr.village || addr.town || addr.municipality || "UTEN NAVN";
                const underNavn = addr.county || addr.state || addr.country || "";

                document.getElementById('location-name').innerText = hovedNavn.toUpperCase();
                document.getElementById('location-sub').innerText = underNavn.toUpperCase();
            } catch (err) {
                document.getElementById('location-name').innerText = "SPORUTSNITT";
                document.getElementById('location-sub').innerText = "";
            }
        }

        function genererHoydeprofil(points) {
            const profileContainer = document.getElementById('elevation-profile');
            profileContainer.innerHTML = '';

            const validPoints = points.filter(p => p.ele !== null && !isNaN(p.ele));

            if (validPoints.length < 2) {
                profileContainer.innerHTML = '<span style="font-size:0.8rem; color:#555; letter-spacing:1px;">INGEN HØYDEDATA I GPX</span>';
                return;
            }

            const totalDist = validPoints[validPoints.length - 1].dist;
            if (totalDist === 0) {
                profileContainer.innerHTML = '<span style="font-size:0.8rem; color:#555; letter-spacing:1px;">UGYLDIG DISTANSE</span>';
                return;
            }

            const minElev = Math.min(...validPoints.map(p => p.ele));
            const maxElev = Math.max(...validPoints.map(p => p.ele));
            const elevRange = (maxElev - minElev) || 1;

            const width = 600;
            const height = 65;
            const padding = 4;

            let pathD = "";
            let areaD = "";

            validPoints.forEach((pt, index) => {
                // X-posisjonen beregnes ut fra distanse i km / total distanse
                const x = (pt.dist / totalDist) * width;
                const normY = (pt.ele - minElev) / elevRange;
                const y = height - (normY * (height - padding * 2) + padding);

                if (index === 0) {
                    pathD += `M ${x.toFixed(1)} ${y.toFixed(1)}`;
                    areaD += `M ${x.toFixed(1)} ${height} L ${x.toFixed(1)} ${y.toFixed(1)}`;
                } else {
                    pathD += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
                    areaD += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
                }
            });

            areaD += ` L ${width} ${height} Z`;

            const svgHTML = `
                <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="elevGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
                        </linearGradient>
                    </defs>
                    <path d="${areaD}" fill="url(#elevGrad)" />
                    <path d="${pathD}" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            `;

            profileContainer.innerHTML = svgHTML;
        }

        document.getElementById('download-btn').addEventListener('click', function() {
            const frame = document.getElementById('poster-frame');
            
            html2canvas(frame, {
                useCORS: true,
                allowTaint: false,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'gpx-poster-1040x1040.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
