<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistisk GPX-visning med Kartverket API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .controls {
      margin-bottom: 15px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status {
      font-weight: 500;
      color: #444;
    }

    /* Minimalistisk hvit ramme */
    #frame {
      width: 650px;
      height: 650px;
      background: #ffffff;
      border: 2px solid #000000;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interaktive etiketter */
    .label-container {
      position: absolute;
      z-index: 10;
      cursor: move;
      user-select: none;
    }

    .draggable-label {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 2px 2px 0px #000000;
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="file" id="gpx-input" accept=".gpx">
    <span id="status">Last opp en GPX-fil</span>
  </div>

  <div id="frame">
    <canvas id="trackCanvas" width="650" height="650"></canvas>
    <div id="labels-layer"></div>
  </div>

  <script>
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');
    const labelsLayer = document.getElementById('labels-layer');
    const statusEl = document.getElementById('status');

    let trackPoints = []; 
    let detectedPeaks = []; 

    // Les GPX direkte i nettleserens minne
    document.getElementById('gpx-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.textContent = "Leser fil...";

      const reader = new FileReader();
      reader.onload = (event) => {
        parseGPX(event.target.result);
      };
      reader.readAsText(file);
    });

    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll("trkpt");

      trackPoints = [];
      trkpts.forEach(pt => {
        trackPoints.push({
          lat: parseFloat(pt.getAttribute("lat")),
          lon: parseFloat(pt.getAttribute("lon"))
        });
      });

      if (trackPoints.length > 0) {
        statusEl.textContent = "Søker etter topper hos Kartverket...";
        fetchPeaksFromKartverket();
      } else {
        statusEl.textContent = "Ingen gyldige spor-punkter funnet i GPX.";
      }
    }

    // Hent topper fra Kartverket Stedsnavn-API basert på GPX-grensene
    async function fetchPeaksFromKartverket() {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      // Legg på en liten margin rundt sporet for BoundingBox-søk (ca. 1-2 km)
      const bbox = `${minLon - 0.02},${minLat - 0.01},${maxLon + 0.02},${maxLat + 0.01}`;
      const apiUrl = `https://api.kartverket.no/stedsnavn/v1/navn?bbox=${bbox}&navneobjekttype=Fjell&maksAntall=50`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        const peaks = parseKartverketResponse(data);
        statusEl.textContent = `Fant ${peaks.length} topper i nærområdet. Renderer...`;
        render(peaks);
      } catch (err) {
        console.error("Kartverket API-feil:", err);
        statusEl.textContent = "Kunne ikke hente topper fra Kartverket. Viser kun spor.";
        render([]);
      }
    }

    function parseKartverketResponse(data) {
      if (!data || !data.navn) return [];
      
      const foundPeaks = [];
      data.navn.forEach(item => {
        const name = item.stedsnavn[0]?.skrivemåte || item.represterendePunkt?.stedsnavn;
        const lat = item.representasjonspunkt?.nord;
        const lon = item.representasjonspunkt?.øst;
        const height = item.meterOverHavet || null;

        if (name && lat && lon) {
          foundPeaks.push({ name, lat, lon, elevation: height });
        }
      });
      return foundPeaks;
    }

    // Haversine-formel for avstand i meter
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function render(apiPeaks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      labelsLayer.innerHTML = '';
      detectedPeaks = [];

      // 1. Finn min/maks
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const latSpan = maxLat - minLat || 0.005;
      const lonSpan = maxLon - minLon || 0.005;

      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const adjustedLonSpan = lonSpan * cosLat;
      const maxSpan = Math.max(latSpan, adjustedLonSpan);
      
      // Økt skaleringen til 60% av rammen (større spor)
      const scale = (canvas.width * 0.60) / maxSpan;

      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      function toCanvasCoords(lat, lon) {
        return {
          x: canvas.width / 2 + (lon - centerLon) * cosLat * scale,
          y: canvas.height / 2 - (lat - centerLat) * scale
        };
      }

      // 2. Tegn sporet
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.8;

      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 3. Sjekk hvilke Kartverket-topper sporet passerer (innenfor 300m)
      const MARGIN_METER = 300; 

      apiPeaks.forEach(peak => {
        let closestPt = null;
        let minDistance = Infinity;

        // Tynner ut sjekkpunkter for ytelse
        const step = Math.max(1, Math.floor(trackPoints.length / 300));
        for (let i = 0; i < trackPoints.length; i += step) {
          const p = trackPoints[i];
          const dist = getDistanceMeters(p.lat, p.lon, peak.lat, peak.lon);
          if (dist < minDistance) {
            minDistance = dist;
            closestPt = p;
          }
        }

        if (minDistance <= MARGIN_METER && closestPt) {
          const anchor = toCanvasCoords(closestPt.lat, closestPt.lon);
          createPeakAnnotation(peak, anchor);
        }
      });

      redrawCanvasAndLines();
    }

    function createPeakAnnotation(peak, anchor) {
      const labelDiv = document.createElement('div');
      labelDiv.className = 'label-container';
      
      const heightText = peak.elevation ? ` (${peak.elevation} m)` : '';
      labelDiv.innerHTML = `<div class="draggable-label">${peak.name}${heightText}</div>`;

      let initialX = anchor.x + 30;
      let initialY = anchor.y - 25;

      labelDiv.style.left = `${initialX}px`;
      labelDiv.style.top = `${initialY}px`;

      labelsLayer.appendChild(labelDiv);

      const peakData = {
        anchorX: anchor.x,
        anchorY: anchor.y,
        labelX: initialX,
        labelY: initialY,
        element: labelDiv
      };

      detectedPeaks.push(peakData);
      makeDraggable(labelDiv, peakData);
    }

    function makeDraggable(element, data) {
      let isDragging = false;
      let startX, startY;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - element.offsetLeft;
        startY = e.clientY - element.offsetTop;
        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const rect = frame.getBoundingClientRect();
        let newX = e.clientX - rect.left - (startX - element.offsetLeft);
        let newY = e.clientY - rect.top - (startY - element.offsetTop);

        element.style.left = `${newX}px`;
        element.style.top = `${newY}px`;

        data.labelX = newX;
        data.labelY = newY;

        redrawCanvasAndLines();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    function redrawCanvasAndLines() {
      // Re-tegn kun stiplede linjer og festeprikker
      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const latSpan = maxLat - minLat || 0.005;
      const lonSpan = maxLon - minLon || 0.005;
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const maxSpan = Math.max(latSpan, lonSpan * cosLat);
      const scale = (canvas.width * 0.60) / maxSpan;
      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      function toCanvasCoords(lat, lon) {
        return {
          x: canvas.width / 2 + (lon - centerLon) * cosLat * scale,
          y: canvas.height / 2 - (lat - centerLat) * scale
        };
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Spor
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.8;
      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Prikker og stiplede linjer
      detectedPeaks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.anchorX, p.anchorY, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        const labelRect = p.element.getBoundingClientRect();
        const targetX = p.labelX;
        const targetY = p.labelY + (labelRect.height / 2);

        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(p.anchorX, p.anchorY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }
  </script>
</body>
</html>
