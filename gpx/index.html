<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistisk GPX-visning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .controls {
      margin-bottom: 15px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #status {
      font-weight: 500;
      color: #444;
    }

    /* Minimalistisk hvit ramme */
    #frame {
      width: 650px;
      height: 650px;
      background: #ffffff;
      border: 2px solid #000000;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interaktive etiketter uten boksdesign */
    .label-container {
      position: absolute;
      z-index: 10;
      cursor: move;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      padding: 2px 4px;
    }

    .draggable-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #000000;
      text-transform: uppercase;
    }

    .delete-btn {
      display: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #ff0000;
      line-height: 1;
      padding: 0 2px;
    }

    .label-container:hover .delete-btn {
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="file" id="gpx-input" accept=".gpx">
    <button id="download-btn">Last ned bilde</button>
    <span id="status">Last opp en GPX-fil</span>
  </div>

  <div id="frame">
    <canvas id="trackCanvas" width="650" height="650"></canvas>
    <div id="labels-layer"></div>
  </div>

  <script>
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');
    const labelsLayer = document.getElementById('labels-layer');
    const statusEl = document.getElementById('status');

    let trackPoints = []; 
    let detectedPeaks = []; 

    document.getElementById('gpx-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.textContent = "Leser GPX-fil...";

      const reader = new FileReader();
      reader.onload = (event) => {
        parseGPX(event.target.result);
      };
      reader.readAsText(file);
    });

    document.getElementById('download-btn').addEventListener('click', downloadImage);

    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll("trkpt");

      trackPoints = [];
      let totalDist = 0;

      trkpts.forEach((pt, index) => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const eleNode = pt.querySelector("ele");
        const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

        if (index > 0) {
          const prev = trackPoints[index - 1];
          totalDist += getDistanceMeters(prev.lat, prev.lon, lat, lon);
        }

        trackPoints.push({ lat, lon, ele, dist: totalDist });
      });

      if (trackPoints.length > 0) {
        statusEl.textContent = "Søker etter topper i kartdata...";
        fetchPeaks();
      } else {
        statusEl.textContent = "Ingen gyldige spor-punkter funnet i GPX.";
      }
    }

    async function fetchPeaks() {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const buffer = 0.025;
      const bMinLat = minLat - buffer;
      const bMaxLat = maxLat + buffer;
      const bMinLon = minLon - buffer;
      const bMaxLon = maxLon + buffer;

      let peaks = [];

      try {
        const url = `https://ws.geonorge.no/stedsnavn/v1/punkt?nordmin=${bMinLat}&nordmaks=${bMaxLat}&ostmin=${bMinLon}&ostmaks=${bMaxLon}&navneobjekttype=Fjell*&maxAntall=100`;
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          peaks = parseKartverketGeonorge(json);
        }
      } catch (err) {
        console.warn("Kartverket API feilet, prøver Overpass fallback...", err);
      }

      if (peaks.length === 0) {
        try {
          const overpassQuery = `[out:json];node["natural"="peak"](${bMinLat},${bMinLon},${bMaxLat},${bMaxLon});out;`;
          const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
          if (res.ok) {
            const json = await res.json();
            peaks = parseOverpass(json);
          }
        } catch (err) {
          console.error("Overpass API feilet:", err);
        }
      }

      statusEl.textContent = `Identifiserte ${peaks.length} potensielle topper. Genererer visning...`;
      render(peaks);
    }

    function parseKartverketGeonorge(data) {
      if (!data || !data.navn) return [];
      const peaks = [];
      data.navn.forEach(item => {
        const name = item.stedsnavn?.[0]?.skrivemåte || item.stedsnavn;
        const lat = item.representasjonspunkt?.nord;
        const lon = item.representasjonspunkt?.øst;
        const height = item.meterOverHavet || item.stedsnavn?.[0]?.meterOverHavet;

        if (name && lat && lon) {
          peaks.push({ name, lat, lon, elevation: height });
        }
      });
      return peaks;
    }

    function parseOverpass(data) {
      if (!data || !data.elements) return [];
      return data.elements.map(el => ({
        name: el.tags?.name || "Ukjent topp",
        lat: el.lat,
        lon: el.lon,
        elevation: el.tags?.ele ? parseInt(el.tags.ele) : null
      }));
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function render(apiPeaks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      labelsLayer.innerHTML = '';
      detectedPeaks = [];

      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const latSpan = maxLat - minLat || 0.005;
      const lonSpan = maxLon - minLon || 0.005;

      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const adjustedLonSpan = lonSpan * cosLat;
      const maxSpan = Math.max(latSpan, adjustedLonSpan);
      
      const scale = (canvas.width * 0.52) / maxSpan;

      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      function toCanvasCoords(lat, lon) {
        return {
          x: canvas.width / 2 + (lon - centerLon) * cosLat * scale,
          y: (canvas.height / 2 - 35) - (lat - centerLat) * scale
        };
      }

      const MARGIN_METER = 500;
      const addedNames = new Set();

      apiPeaks.forEach(peak => {
        if (addedNames.has(peak.name)) return;

        let closestPt = null;
        let minDistance = Infinity;

        const step = Math.max(1, Math.floor(trackPoints.length / 400));
        for (let i = 0; i < trackPoints.length; i += step) {
          const p = trackPoints[i];
          const dist = getDistanceMeters(p.lat, p.lon, peak.lat, peak.lon);
          if (dist < minDistance) {
            minDistance = dist;
            closestPt = p;
          }
        }

        if (minDistance <= MARGIN_METER && closestPt) {
          addedNames.add(peak.name);
          const anchor = toCanvasCoords(closestPt.lat, closestPt.lon);
          createPeakAnnotation(peak, anchor);
        }
      });

      redrawCanvasAndLines();
    }

    function createPeakAnnotation(peak, anchor) {
      const labelContainer = document.createElement('div');
      labelContainer.className = 'label-container';
      
      const heightText = peak.elevation ? ` ${peak.elevation}m` : '';
      const formattedName = `${peak.name.toUpperCase()}${heightText}`;

      labelContainer.innerHTML = `
        <span class="draggable-label">${formattedName}</span>
        <span class="delete-btn" title="Fjern topp">×</span>
      `;

      let initialX = anchor.x + 35;
      let initialY = anchor.y - 25;

      labelContainer.style.left = `${initialX}px`;
      labelContainer.style.top = `${initialY}px`;

      labelsLayer.appendChild(labelContainer);

      const peakData = {
        id: Date.now() + Math.random(),
        anchorX: anchor.x,
        anchorY: anchor.y,
        labelX: initialX,
        labelY: initialY,
        element: labelContainer
      };

      const deleteBtn = labelContainer.querySelector('.delete-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        labelContainer.remove();
        detectedPeaks = detectedPeaks.filter(p => p.id !== peakData.id);
        redrawCanvasAndLines();
      });

      detectedPeaks.push(peakData);
      makeDraggable(labelContainer, peakData);
    }

    function makeDraggable(element, data) {
      let isDragging = false;
      let startMouseX = 0;
      let startMouseY = 0;
      let startElemX = 0;
      let startElemY = 0;

      element.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('delete-btn')) return;
        
        isDragging = true;
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        startElemX = data.labelX;
        startElemY = data.labelY;
        
        e.stopPropagation();
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const dx = e.clientX - startMouseX;
        const dy = e.clientY - startMouseY;

        let newX = startElemX + dx;
        let newY = startElemY + dy;

        element.style.left = `${newX}px`;
        element.style.top = `${newY}px`;

        data.labelX = newX;
        data.labelY = newY;

        redrawCanvasAndLines();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    function redrawCanvasAndLines() {
      if (trackPoints.length === 0) return;

      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const latSpan = maxLat - minLat || 0.005;
      const lonSpan = maxLon - minLon || 0.005;
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const maxSpan = Math.max(latSpan, lonSpan * cosLat);
      const scale = (canvas.width * 0.52) / maxSpan;
      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      function toCanvasCoords(lat, lon) {
        return {
          x: canvas.width / 2 + (lon - centerLon) * cosLat * scale,
          y: (canvas.height / 2 - 35) - (lat - centerLat) * scale
        };
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Tegn sporet
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.8;
      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 2. Tegn toppmarkeringer og vinklede stiplede linjer
      detectedPeaks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.anchorX, p.anchorY, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        const labelHeight = p.element.offsetHeight || 15;
        const targetX = p.labelX;
        const targetY = p.labelY + (labelHeight / 2);

        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(p.anchorX, p.anchorY);
        ctx.lineTo(targetX, p.anchorY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // 3. Tegn Høydeprofil (Dekker 55% av rammen)
      drawElevationProfile();

      // 4. Tegn start-koordinat nederst i rammen
      drawStartCoordinates();
    }

    function drawElevationProfile() {
      const profileWidth = canvas.width * 0.55;
      const profileHeight = 50;
      const startX = (canvas.width - profileWidth) / 2;
      const startY = canvas.height - 75;

      let maxEle = -Infinity;
      let minEle = Infinity;
      let maxPt = null;

      trackPoints.forEach(p => {
        if (p.ele > maxEle) {
          maxEle = p.ele;
          maxPt = p;
        }
        if (p.ele < minEle) minEle = p.ele;
      });

      const totalDistance = trackPoints[trackPoints.length - 1].dist;
      if (totalDistance <= 0 || maxEle === minEle) return;

      const eleSpan = maxEle - minEle || 1;

      function getProfileX(dist) {
        return startX + (dist / totalDistance) * profileWidth;
      }

      function getProfileY(ele) {
        return startY + profileHeight - ((ele - minEle) / eleSpan) * profileHeight;
      }

      // Tegn profillinje
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;

      trackPoints.forEach((p, index) => {
        const px = getProfileX(p.dist);
        const py = getProfileY(p.ele);
        if (index === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      // Marker høyeste punkt i profilen
      if (maxPt) {
        const peakX = getProfileX(maxPt.dist);
        const peakY = getProfileY(maxPt.ele);

        // Prikk på toppen
        ctx.beginPath();
        ctx.arc(peakX, peakY, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        // Vertikal stiplet linje oppover fra profilen
        const lineTopY = peakY - 12;
        ctx.beginPath();
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(peakX, lineTopY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Tekst for Høyeste punkt
        ctx.font = "bold 9px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#000000";
        ctx.textAlign = "center";
        ctx.fillText(`MAKS ${Math.round(maxEle)}m`, peakX, lineTopY - 3);
      }
    }

    function drawStartCoordinates() {
      if (trackPoints.length === 0) return;

      const start = trackPoints[0];
      const latStr = start.lat.toFixed(5);
      const lonStr = start.lon.toFixed(5);
      const text = `START: ${latStr}° N, ${lonStr}° E`;

      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText(text, canvas.width / 2, canvas.height - 15);
    }

    function downloadImage() {
      if (trackPoints.length === 0) {
        alert("Last opp en GPX-fil først!");
        return;
      }

      // Lag et midlertidig canvas for sammenslåing av spor og tekst-etiketter
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      // Tegn over canvas-innholdet
      exportCtx.drawImage(canvas, 0, 0);

      // Render HTML-etikettene direkte over i bildet
      detectedPeaks.forEach(p => {
        const text = p.element.querySelector('.draggable-label').textContent;
        exportCtx.font = "bold 11px -apple-system, BlinkMacSystemFont, sans-serif";
        exportCtx.fillStyle = "#000000";
        exportCtx.textAlign = "left";
        exportCtx.fillText(text, p.labelX + 4, p.labelY + 12);
      });

      // Last ned som bilde
      const link = document.createElement('a');
      link.download = 'gpx-spor.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
