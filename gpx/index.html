<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistisk GPX-Visning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .controls {
      margin-bottom: 15px;
      font-size: 13px;
    }

    /* Minimalistisk hvit ramme */
    #frame {
      width: 650px;
      height: 650px;
      background: #ffffff;
      border: 2px solid #000000;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interaktive etiketter */
    .label-container {
      position: absolute;
      z-index: 10;
      cursor: move;
      user-select: none;
    }

    .draggable-label {
      background: #ffffff;
      border: 1px solid #000000;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 2px 2px 0px #000000;
    }
  </style>
</head>
<body>

  <div class="controls">
    <input type="file" id="gpx-input" accept=".gpx">
  </div>

  <div id="frame">
    <canvas id="trackCanvas" width="650" height="650"></canvas>
    <div id="labels-layer"></div>
  </div>

  <script>
    // Enkel fjelldatabase (legg til flere koord/fjell etter ønske)
    const DATABASE_TOPPER = [
      { name: "Store Blåmann", elevation: 1044, lat: 69.7345, lon: 18.5912 },
      { name: "Bønntuva", elevation: 776, lat: 69.6105, lon: 19.0831 },
      { name: "Middagstinden", elevation: 1006, lat: 69.5631, lon: 18.2583 },
      { name: "Tromsdalstinden", elevation: 1238, lat: 69.6081, lon: 19.1378 }
    ];

    const MARGIN_METER = 200; // Toleranseavstand fra spor til topp

    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');
    const labelsLayer = document.getElementById('labels-layer');

    let trackPoints = []; // [{lat, lon}]
    let detectedPeaks = []; // [{peak, canvasAnchorX, canvasAnchorY, labelX, labelY, element}]

    // Havversine avstandsberegning (i meter)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Les GPX direkte via DOMParser i nettleseren
    document.getElementById('gpx-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        parseGPX(event.target.result);
      };
      reader.readAsText(file);
    });

    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll("trkpt");

      trackPoints = [];
      trkpts.forEach(pt => {
        trackPoints.push({
          lat: parseFloat(pt.getAttribute("lat")),
          lon: parseFloat(pt.getAttribute("lon"))
        });
      });

      if (trackPoints.length > 0) {
        render();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      labelsLayer.innerHTML = '';
      detectedPeaks = [];

      // 1. Finn min/maks for transformering
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      // 2. Skaler slik at sporet dekker ca 35% av rammen (65% margin)
      const latSpan = maxLat - minLat || 0.01;
      const lonSpan = maxLon - minLon || 0.01;

      // Korriger for breddegrad for å unngå forvrengning
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const adjustedLonSpan = lonSpan * cosLat;

      const maxSpan = Math.max(latSpan, adjustedLonSpan);
      
      // 35% dekning betyr at skaleringsfaktoren beregnes ut fra 35% av lerretsstørrelsen
      const scale = (canvas.width * 0.35) / maxSpan;

      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      // Transformasjonsfunksjon fra (lat, lon) til canvas (x, y)
      function toCanvasCoords(lat, lon) {
        const x = canvas.width / 2 + (lon - centerLon) * cosLat * scale;
        const y = canvas.height / 2 - (lat - centerLat) * scale;
        return { x, y };
      }

      // 3. Tegn sporet
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;

      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 4. Finn og noter topper innenfor marginen
      DATABASE_TOPPER.forEach(peak => {
        let closestPt = null;
        let minDistance = Infinity;

        trackPoints.forEach(p => {
          const dist = getDistanceMeters(p.lat, p.lon, peak.lat, peak.lon);
          if (dist < minDistance) {
            minDistance = dist;
            closestPt = p;
          }
        });

        if (minDistance <= MARGIN_METER && closestPt) {
          const anchor = toCanvasCoords(closestPt.lat, closestPt.lon);
          createPeakAnnotation(peak, anchor);
        }
      });

      drawConnectors();
    }

    function createPeakAnnotation(peak, anchor) {
      // Tegn festeprikken på sporet
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "#000000";
      ctx.fill();

      // Lag dragbar HTML-etikett
      const labelDiv = document.createElement('div');
      labelDiv.className = 'label-container';
      labelDiv.innerHTML = `<div class="draggable-label">${peak.name} (${peak.elevation} m)</div>`;

      // Startposisjon (forskjøvet litt opp til høyre)
      let initialX = anchor.x + 40;
      let initialY = anchor.y - 30;

      labelDiv.style.left = `${initialX}px`;
      labelDiv.style.top = `${initialY}px`;

      labelsLayer.appendChild(labelDiv);

      const peakData = {
        anchorX: anchor.x,
        anchorY: anchor.y,
        labelX: initialX,
        labelY: initialY,
        element: labelDiv
      };

      detectedPeaks.push(peakData);

      // Gjør etiketten dragbar med mus/touch
      makeDraggable(labelDiv, peakData);
    }

    function makeDraggable(element, data) {
      let isDragging = false;
      let startX, startY;

      element.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - element.offsetLeft;
        startY = e.clientY - element.offsetTop;
        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const rect = frame.getBoundingClientRect();
        let newX = e.clientX - rect.left - (startX - element.offsetLeft);
        let newY = e.clientY - rect.top - (startY - element.offsetTop);

        element.style.left = `${newX}px`;
        element.style.top = `${newY}px`;

        data.labelX = newX;
        data.labelY = newY;

        redrawCanvasAndLines();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    function redrawCanvasAndLines() {
      // Re-tegn kun sporet og festeprikkene + stiplede linjer
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Re-tegn spor
      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const maxSpan = Math.max(maxLat - minLat || 0.01, (maxLon - minLon || 0.01) * cosLat);
      const scale = (canvas.width * 0.35) / maxSpan;
      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      function toCanvasCoords(lat, lon) {
        return {
          x: canvas.width / 2 + (lon - centerLon) * cosLat * scale,
          y: canvas.height / 2 - (lat - centerLat) * scale
        };
      }

      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Tegn prikker og stiplede linjer
      detectedPeaks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.anchorX, p.anchorY, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        // Stiplet linje til etikettens midtpunkt
        const labelRect = p.element.getBoundingClientRect();
        const targetX = p.labelX;
        const targetY = p.labelY + (labelRect.height / 2);

        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(p.anchorX, p.anchorY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]); // Tilbakestill
      });
    }

    function drawConnectors() {
      redrawCanvasAndLines();
    }
  </script>
</body>
</html>
