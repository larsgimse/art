<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toppturer - Oversiktskart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
            --winter-blue: #0ea5e9;
            --summer-green: #34a853;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }
        
        .nav-buttons { display: flex; gap: 6px; align-items: center; }
        
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-reset { background: #222; border-color: #444; color: #ccc; }
        .btn-export { background: #3b82f6; border-color: #60a5fa; color: #fff; }
        .btn-winter.active { background: var(--winter-blue); border-color: #fff; font-weight: 700; }
        .btn-summer.active { background: var(--summer-green); border-color: #fff; font-weight: 700; }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        /* Tinn-liste panel */
        #peak-list-panel {
            position: absolute;
            top: 70px;
            right: 10px;
            width: 260px;
            max-height: calc(100vh - 100px);
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .panel-header {
            padding: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .peak-list {
            overflow-y: auto;
            max-height: 400px;
            list-style: none;
        }

        .peak-item {
            padding: 8px 10px;
            font-size: 0.8rem;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .peak-item:last-child { border-bottom: none; }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .delete-btn:hover { color: #ff6b6b; }

        /* Stil for ren navnelapp uten bakgrunn */
        .clean-peak-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: 800;
            font-size: 13px;
            color: #ffffff;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000, 1px -1px 3px #000, -1px 1px 3px #000;
            cursor: move;
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .clean-peak-label::before { display: none !important; }

        .overlay-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        @media (max-width: 600px) {
            header { top: auto; bottom: 20px; flex-direction: column; gap: 8px; }
            #peak-list-panel { top: 10px; right: 10px; width: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Toppturer</h1>
        <div class="nav-buttons">
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
            <button id="btn-vinter" class="btn btn-winter">❄️ Vinter</button>
            <button id="btn-sommer" class="btn btn-summer">☀️ Sommer</button>
            <button id="btn-export" class="btn btn-export">📸 Bilde</button>
        </div>
    </header>

    <div id="peak-list-panel">
        <div class="panel-header">
            <span>Topper på kartet</span>
            <span id="peak-count" style="color:#888;">0</span>
        </div>
        <ul id="peak-list" class="peak-list"></ul>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <svg id="svg-lines" class="overlay-svg"></svg>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const map = L.map('map', { zoomControl: true }).setView([69.65, 18.95], 9);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_2o3a_1_671194bbedbad28841272141', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20,
            crossOrigin: true
        }).addTo(map);

        const svg = document.getElementById('svg-lines');
        let peaksData = [];

        async function lastToppData() {
            // Eksempel-data
            const mockTopper = [
                { id: '1', navn: 'BUREN', hoyde: '802m', lat: 69.62, lon: 18.80, type: 'vinter' },
                { id: '2', navn: 'STORE BLÅMANN', hoyde: '1044m', lat: 69.73, lon: 18.59, type: 'sommer' },
                { id: '3', navn: 'MUSA', hoyde: '1025m', lat: 69.58, lon: 19.10, type: 'vinter' }
            ];

            peaksData = mockTopper;
            oppdaterTopper();
        }

        function oppdaterTopper() {
            // Fjern eksisterende markører/linjer
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });
            svg.innerHTML = '';
            
            const listEl = document.getElementById('peak-list');
            listEl.innerHTML = '';
            document.getElementById('peak-count').textContent = peaksData.length;

            peaksData.forEach((topp) => {
                // Legg til i listen
                const li = document.createElement('li');
                li.className = 'peak-item';
                li.innerHTML = `
                    <span>${topp.navn} (${topp.hoyde})</span>
                    <button class="delete-btn" title="Fjern topp" onclick="fjernTopp('${topp.id}')">&times;</button>
                `;
                listEl.appendChild(li);

                // Opprett kartelementer
                opprettToppElementer(topp);
            });
        }

        function fjernTopp(id) {
            peaksData = peaksData.filter(t => t.id !== id);
            oppdaterTopper();
        }

        function opprettToppElementer(topp) {
            const toppLatLng = L.latLng(topp.lat, topp.lon);

            // Selve toppunkt-merket (Lite usynlig/lite merke på fjellet)
            const targetMarker = L.circleMarker(toppLatLng, {
                radius: 3,
                color: '#ffffff',
                fillColor: '#ffffff',
                fillOpacity: 1
            }).addTo(map);

            // Flyttbar tekst-lapp
            const labelText = `${topp.navn} ${topp.hoyde}`;
            const labelIcon = L.divIcon({
                className: 'clean-peak-label',
                html: labelText,
                iconAnchor: [-10, 10]
            });

            const labelMarker = L.marker(toppLatLng, {
                icon: labelIcon,
                draggable: true
            }).addTo(map);

            // Vinklet stiplet pekelinje (SVG)
            const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polyline.setAttribute("stroke", "#ffffff");
            polyline.setAttribute("stroke-width", "1.5");
            polyline.setAttribute("stroke-dasharray", "4 3");
            polyline.setAttribute("fill", "none");
            svg.appendChild(polyline);

            function tegnVinkletLinje() {
                const targetPoint = map.latLngToContainerPoint(toppLatLng);
                let labelPoint = map.latLngToContainerPoint(labelMarker.getLatLng());

                // Begrens navnelappen til å holde seg innenfor kartets visning
                const mapSize = map.getSize();
                const padding = 20;
                let clampedX = Math.max(padding, Math.min(mapSize.x - padding, labelPoint.x));
                let clampedY = Math.max(padding, Math.min(mapSize.y - padding, labelPoint.y));

                if (clampedX !== labelPoint.x || clampedY !== labelPoint.y) {
                    labelPoint = L.point(clampedX, clampedY);
                    const newLatLng = map.containerPointToLatLng(labelPoint);
                    labelMarker.setLatLng(newLatLng);
                }

                // Kneepoint for vinklet linje (L-form/kneledd)
                const kneeX = targetPoint.x;
                const kneeY = labelPoint.y;

                polyline.setAttribute("points", `${targetPoint.x},${targetPoint.y} ${kneeX},${kneeY} ${labelPoint.x},${labelPoint.y}`);
            }

            labelMarker.on('drag', tegnVinkletLinje);
            map.on('move zoomEnd', tegnVinkletLinje);
            tegnVinkletLinje();
        }

        lastToppData();
    </script>
</body>
</html>
